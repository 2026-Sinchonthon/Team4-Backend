spring:
  application:
    name: sinchonthon4

  # 활성 프로파일 (환경변수 SPRING_PROFILES_ACTIVE 로 override, 기본 local)
  profiles:
    default: local

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# 로컬 개발 프로파일 (Docker MySQL)
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/sinchonthon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:sinchonthon}
    password: ${DB_PASSWORD:sinchonthon}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

---
# 배포 프로파일 (RDS MySQL)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
